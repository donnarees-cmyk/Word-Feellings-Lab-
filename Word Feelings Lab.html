<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Word Feelings Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<style>
/* Layout: a vault map of 6 locks; each lock opens a one-card-at-a-time lesson (learn → try → practice → key unlocked). Single committed look: navy vault, cream cards, gold keys. */
:root{
  --vault:#13203f; --vault-2:#1d2d55; --gold:#f2b705; --gold-deep:#c98f00;
  --card:#fffaf0; --ink:#1b2240; --muted:#5b6283; --line:#e6dcc6;
  --good:#1f9d6b; --good-bg:#e3f6ec; --try:#d9822b; --try-bg:#fff0de; --miss:#c2416b; --miss-bg:#fde7ee;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--vault);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;
  background-image:radial-gradient(circle at 15% 10%,rgba(242,183,5,.10),transparent 40%),radial-gradient(circle at 85% 90%,rgba(90,140,255,.12),transparent 45%);min-height:100%}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#fff;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-spot{width:64px;height:64px;border-radius:14px;border:2px dashed rgba(242,183,5,.6);display:grid;place-items:center;overflow:hidden;flex:none}
.logo-spot img{width:100%;height:100%;object-fit:contain}
.brand small{display:block;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.brand b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em}
.score-pill{background:var(--vault-2);border:2px solid var(--gold);color:#fff;border-radius:999px;padding:6px 16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.score-pill span{color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;line-height:1.15}
.hero{color:#fff;text-align:left;margin:8px 0 22px}
.hero h1{font-size:clamp(34px,7vw,56px);color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.25)}
.hero p{max-width:60ch;margin:8px 0 0;color:#dfe6ff}
.card{background:var(--card);border-radius:22px;padding:24px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.name-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
input[type=text],textarea{font:inherit;font-size:18px;border:3px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;color:var(--ink);width:100%}
input[type=text]{flex:1 1 220px;width:auto}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
.btn{font:inherit;font-weight:700;font-size:18px;border:none;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--gold-deep);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-deep)}
.btn:focus-visible,.opt:focus-visible,.lock:focus-visible,.tapline:focus-visible{outline:4px solid #5a8cff;outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--line)}
.btn.dark{background:var(--vault-2);color:#fff;box-shadow:0 4px 0 #0b1430}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* map */
.map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:620px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lock{border:none;font:inherit;text-align:left;cursor:pointer;border-radius:20px;padding:16px;background:var(--card);color:var(--ink);position:relative;box-shadow:0 6px 0 rgba(0,0,0,.2);display:flex;flex-direction:column;gap:6px;min-height:150px;border-top:10px solid var(--c)}
.lock .num{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.lock h3{font-size:21px}
.lock p{margin:0;font-size:15px;color:var(--muted)}
.lock .status{margin-top:auto;font-weight:700;font-size:15px}
.lock.done{background:#fff6d6}
.lock.done .status{color:var(--good)}
.keyicon{position:absolute;top:10px;right:12px;width:34px;height:34px}
/* station */
.station-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#fff;margin-bottom:12px}
.station-head h2{font-size:clamp(24px,5vw,34px);color:#fff}
.station-head .eyebrow{color:var(--gold);font-size:14px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.progress{height:14px;background:var(--vault-2);border-radius:999px;overflow:hidden;margin-bottom:16px;border:2px solid rgba(255,255,255,.15)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffd95a);border-radius:999px;transition:width .4s}
.step-tag{display:inline-block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--c);color:#fff;margin-bottom:10px}
.card h3{font-size:28px;margin-bottom:10px;color:var(--ink)}
.card p{margin:0 0 12px;max-width:68ch}
.card ul{margin:0 0 12px;padding-left:22px}
.card li{margin-bottom:6px}
.term{font-weight:700;color:var(--c)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0 14px}
.chip{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:16px}
.chip b{color:var(--c);font-size:18px}
.tip{background:#fff;border-left:6px solid var(--gold);border-radius:12px;padding:12px 14px;margin:12px 0}
.passage{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 16px;font-size:18px}
.passage .pt{font-family:var(--display);font-size:20px;margin-bottom:6px;color:var(--c)}
.poem{white-space:pre-line;font-style:italic}
.dok{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:2px solid var(--line);border-radius:999px;padding:2px 10px;margin-bottom:8px}
.stds{display:flex;flex-wrap:wrap;gap:6px;align-items:center;color:#dfe6ff;font-size:14px;margin:-8px 0 16px}.stds span{background:var(--vault-2);border:1px solid rgba(242,183,5,.5);border-radius:999px;padding:3px 10px}
.duerow{display:flex;gap:12px;align-items:center;font-size:19px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:#fff;margin-top:8px;cursor:pointer}.duerow input{flex:none;width:26px;height:26px;accent-color:#1f9d6b}
.grp{color:var(--gold);font-size:clamp(22px,4.5vw,30px);margin:22px 0 2px}
.grp-note{color:#dfe6ff;margin:0 0 12px}
.stdbox{background:#eef3ff;border:2px solid #b9c8f0;border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:15px;line-height:1.45}.stdbox .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}.stdbox p{margin:4px 0 0;max-width:none}.stdbox b{color:#1d3d8f}.lockstd{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.q{font-weight:700;font-size:20px;margin:0 0 12px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;border:3px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:12px 16px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt .ltr{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.opt:hover:not([disabled]){border-color:var(--c)}
.opt.sel{border-color:var(--c);background:#f6f3ff}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--miss);background:var(--miss-bg);opacity:.75}
.opt[disabled]{cursor:default}
.tapline{display:block;width:100%;font:inherit;text-align:left;border:2px dashed transparent;background:transparent;color:var(--ink);border-radius:10px;padding:6px 8px;cursor:pointer;margin:2px 0}
.tapline:hover:not([disabled]){background:#fff6d6;border-color:var(--gold)}
.tapline.right{background:var(--good-bg);border:2px solid var(--good)}
.tapline.wrong{background:var(--miss-bg);border:2px solid var(--miss);opacity:.75}
.order-bank,.order-ans{display:flex;flex-direction:column;gap:8px;min-height:50px}
.order-ans{background:#fff;border:3px dashed var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.order-ans .opt .ltr{background:var(--gold);color:var(--ink)}
.feedback{margin-top:14px;border-radius:14px;padding:14px 16px;font-size:17px}
.feedback.good{background:var(--good-bg);border:2px solid var(--good)}
.feedback.hint{background:var(--try-bg);border:2px solid var(--try)}
.feedback.miss{background:var(--miss-bg);border:2px solid var(--miss)}
.feedback b.big{display:block;font-family:var(--display);font-weight:400;font-size:22px;margin-bottom:4px}
.starters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.starters button{font:inherit;font-size:15px;border:2px solid var(--c);color:var(--ink);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
textarea{min-height:150px;resize:vertical}
.wc{font-size:14px;color:var(--muted);margin-top:4px}
.model{background:#fff;border:2px dashed var(--c);border-radius:12px;padding:12px 14px;margin-top:10px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.speak{font:inherit;font-size:15px;font-weight:700;border:2px solid var(--c);background:#fff;color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;float:right;margin:0 0 8px 10px}
.example-reveal{margin-top:10px}
.bigkey{display:block;margin:6px auto 10px;width:120px;height:120px;animation:spin 1.4s ease-out}
.bigkey svg,.keyicon svg{width:100%;height:100%;display:block}
@keyframes spin{from{transform:rotate(-200deg) scale(.3)}to{transform:none}}
.center{text-align:center}
.center p{margin-left:auto;margin-right:auto}
.cert{border:6px double var(--gold);border-radius:22px;padding:22px;text-align:center;background:#fffdf5}
.cert h2{font-size:clamp(28px,6vw,44px);color:var(--gold-deep)}
.cert .who{font-family:var(--display);font-size:clamp(30px,7vw,48px);color:var(--ink);margin:8px 0}
.tally{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:14px 0;text-align:left}
.tally div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:15px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(150%);background:var(--gold);color:var(--ink);font-family:var(--display);font-size:22px;padding:12px 22px;border-radius:999px;box-shadow:0 6px 0 var(--gold-deep);transition:transform .3s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
svg text{font-family:var(--body)}
footer{color:#aab4d6;font-size:13px;text-align:center;margin-top:26px}

/* ===== animations ===== */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(31,157,107,.55)}100%{box-shadow:0 0 0 14px rgba(31,157,107,0)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-3deg)}100%{transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:400px 0}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
.card{animation:rise .45s ease-out both}
.station-head h2,.hero h1{animation:popIn .5s ease-out both}
.opts .opt,.order-bank .opt,.tapline{animation:rise .4s ease-out both}
.opts .opt:nth-child(1),.tapline:nth-child(2){animation-delay:.05s}.opts .opt:nth-child(2),.tapline:nth-child(3){animation-delay:.12s}
.opts .opt:nth-child(3),.tapline:nth-child(4){animation-delay:.19s}.opts .opt:nth-child(4),.tapline:nth-child(5){animation-delay:.26s}
.opts .opt:nth-child(5),.tapline:nth-child(6){animation-delay:.33s}
.opt:hover:not([disabled]),.lock:hover{transform:translateY(-3px)}
.opt,.lock{transition:transform .15s,border-color .15s,background .15s}
.opt.right,.tapline.right{animation:popIn .35s ease-out both,glow 1s ease-out .1s}
.opt.wrong,.tapline.wrong{animation:shake .4s}
.feedback{animation:rise .35s ease-out both}
.feedback.good b.big::before{content:"🔑 ";display:inline-block;animation:wiggle .6s ease-in-out 2}
.chip{animation:popIn .4s ease-out both}
.chips .chip:nth-child(2){animation-delay:.08s}.chips .chip:nth-child(3){animation-delay:.16s}.chips .chip:nth-child(4){animation-delay:.24s}.chips .chip:nth-child(5){animation-delay:.32s}.chips .chip:nth-child(6){animation-delay:.4s}.chips .chip:nth-child(7){animation-delay:.48s}.chips .chip:nth-child(8){animation-delay:.56s}
.map .lock{animation:rise .45s ease-out both}
.map .lock:nth-child(2){animation-delay:.08s}.map .lock:nth-child(3){animation-delay:.16s}.map .lock:nth-child(4){animation-delay:.24s}.map .lock:nth-child(5){animation-delay:.32s}
.lock.done .keyicon{animation:floaty 2.4s ease-in-out infinite}
.score-pill.bump{animation:bump .5s ease-out}
.progress i{background:linear-gradient(90deg,var(--gold),#ffe58a,var(--gold));background-size:200px 100%;animation:shimmer 2.2s linear infinite}
.detective{display:inline-block;font-size:44px;animation:floaty 2.6s ease-in-out infinite}
/* sorting animation */
.sortbox{position:relative;height:250px;background:#fff;border:2px solid var(--line);border-radius:16px;margin:10px 0 14px;overflow:hidden}
.sortbox .bin{position:absolute;bottom:10px;width:23%;height:92px;border:3px dashed var(--c);border-radius:14px;background:#f7fbfa;text-align:center;font-weight:700;font-size:14px;padding-top:62px;color:var(--ink)}
.sortbox .pile{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--muted)}
.sortbox .it{position:absolute;z-index:2;font-size:30px;line-height:1;left:var(--x);top:var(--y);animation:sortIt 7s ease-in-out infinite;animation-delay:var(--d)}
@keyframes sortIt{0%,8%{left:calc(50% - 15px + var(--px));top:34px;transform:scale(1)}22%{transform:scale(1.25)}30%,88%{left:var(--x);top:var(--y);transform:scale(1)}100%{left:calc(50% - 15px + var(--px));top:34px}}
/* venn animation */
.vennbox{position:relative;height:230px;background:#fff;border:2px solid var(--line);border-radius:16px;margin:10px 0 14px;overflow:hidden}
.vc{position:absolute;top:22px;width:190px;height:190px;border-radius:50%;border:4px solid}
.vc.a{left:calc(50% - 160px);border-color:#2c7be5;background:rgba(44,123,229,.12);animation:vennL 6s ease-in-out infinite}
.vc.b{left:calc(50% - 30px);border-color:#e76f51;background:rgba(231,111,81,.12);animation:vennR 6s ease-in-out infinite}
@keyframes vennL{0%{transform:translateX(-90px)}25%,90%{transform:none}100%{transform:translateX(-90px)}}
@keyframes vennR{0%{transform:translateX(90px)}25%,90%{transform:none}100%{transform:translateX(90px)}}
.vl{position:absolute;font-weight:700;font-size:14px;text-align:center;width:100px;opacity:0;animation:vfade 6s ease-in-out infinite}
@keyframes vfade{0%,30%{opacity:0;transform:translateY(8px)}40%,88%{opacity:1;transform:none}100%{opacity:0}}
@media (max-width:480px){.vc{width:150px;height:150px}.vc.a{left:calc(50% - 125px)}.vc.b{left:calc(50% - 25px)}.sortbox .it{font-size:24px}}

/* ===== tone & word choice animations ===== */
.tonebox{position:relative;height:150px;background:#fff;border:2px solid var(--line);border-radius:16px;margin:10px 0 14px;overflow:hidden}
.tonebox .topic{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tonebox .tc{position:absolute;left:16px;right:16px;top:38px;text-align:center;opacity:0;animation:tcyc 9s ease-in-out infinite}
.tonebox .tc q{display:block;font-size:19px;font-style:italic;quotes:"\201C" "\201D"}
.tonebox .tc span{display:inline-block;margin-top:10px;font-weight:700;font-size:15px;color:#fff;border-radius:999px;padding:3px 14px}
.tonebox .tc:nth-of-type(2){animation-delay:3s}.tonebox .tc:nth-of-type(3){animation-delay:6s}
@keyframes tcyc{0%{opacity:0;transform:translateY(14px)}5%,28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-14px)}}
.connobox{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0 14px}
.connorow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.cw{border-radius:14px;padding:10px 6px;font-weight:700;font-size:19px;animation:popIn .5s ease-out both}
.cw small{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:.85}
.cw.neg{background:#fde7ee;border:2px solid #c2416b;color:#8a1f45}
.cw.neu{background:#eef0f5;border:2px solid #8a90a8;color:#3b4160;animation-delay:.5s}
.cw.pos{background:#e3f6ec;border:2px solid #1f9d6b;color:#106b47;animation-delay:1s}
.connobar{height:12px;border-radius:999px;margin-top:10px;background:linear-gradient(90deg,#c2416b,#c9ccd8,#1f9d6b);position:relative}
.connobar i{position:absolute;top:-5px;width:22px;height:22px;border-radius:50%;background:var(--gold);border:3px solid var(--ink);animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{left:0}to{left:calc(100% - 22px)}}
.connolbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);margin-top:6px}
.flip2{position:relative;height:120px;background:#fff;border:2px solid var(--line);border-radius:16px;margin:10px 0 14px;overflow:hidden}
.flip2 .fl{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 16px;text-align:center;opacity:0;animation:fl2 8s ease-in-out infinite}
.flip2 .fl:nth-child(2){animation-delay:4s}
.flip2 .fl q{font-size:19px;font-style:italic}
.flip2 .fl span{margin-top:8px;font-weight:700;font-size:15px;color:#fff;border-radius:999px;padding:3px 14px}
@keyframes fl2{0%{opacity:0;transform:scale(.9)}6%,44%{opacity:1;transform:none}50%,100%{opacity:0;transform:scale(1.05)}}
.meterbox{background:#fff;border:2px solid var(--line);border-radius:16px;margin:10px 0 14px;padding:10px;text-align:center}
.meterbox svg{width:100%;max-width:340px;height:auto}
.needle{transform-origin:170px 160px;animation:swing 6s ease-in-out infinite}
@keyframes swing{0%,15%{transform:rotate(-62deg)}45%,60%{transform:rotate(62deg)}90%,100%{transform:rotate(-62deg)}}
.chip.neg b{color:#c2416b}.chip.pos b{color:#1f9d6b}.chip.neu b{color:#5b6283}
.pill-neg{background:#c2416b}.pill-pos{background:#1f9d6b}.pill-neu{background:#5b6283}.pill-gold{background:#c98f00}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.logo-img{width:76px;height:76px;flex:none;border-radius:14px;background:#fff;object-fit:contain;box-shadow:0 3px 0 rgba(0,0,0,.25)}
</style>

<div class="wrap">

const PAGE = {key:"ll-denot-connot-v1", day:"Denotation & Connotation", title:"Word Feelings Lab",

const STATIONS = [
{ id:"two", g:"all", std:["ELA.6.V.1.3"], color:"#7b4fd6", title:"Two Kinds of Meaning", blurb:"Dictionary vs. feeling",
  learn:[
   {h:"Every word has two meanings", html:`<ul><li><span class="term">Denotation</span> = the <b>dictionary meaning</b>. It's the exact, literal definition.</li>
   <li><span class="term">Connotation</span> = the <b>feeling</b> or idea a word carries. It can be <b>positive</b>, <b>negative</b>, or <b>neutral</b>.</li></ul>
   ${FLIP("This is my house.","just a building","pill-neu","This is my home.","warm, safe, loved","pill-pos","Animation: house versus home")}
   <p><i>House</i> and <i>home</i> have almost the same denotation: a place where people live. But <i>home</i> carries feelings of family, comfort, and love. That's connotation!</p>
   <div class="tip"><b>Memory trick:</b> <b>D</b>enotation = <b>D</b>ictionary. <b>C</b>onnotation = <b>C</b>an you feel it?</div>`},
   {h:"How to check connotation", html:`<p>Ask yourself these three questions:</p>
   <ul><li><b>1.</b> Would I want someone to use this word to describe <b>me</b>?</li><li><b>2.</b> Does this word make me picture something <b>pleasant</b> or <b>unpleasant</b>?</li><li><b>3.</b> Is there a <b>plainer</b> word that means the same thing? (That plainer word is usually neutral.)</li></ul>
   ${CONNO("scrawny","thin","slender","Animation: scrawny, thin, slender on a scale")}`}
  ],
  example:{q:`"Jada's little brother is <b>curious</b>." vs. "Jada's little brother is <b>nosy</b>." What is the same, and what is different?`,a:`<b>Same denotation:</b> both mean he wants to know things. <b>Different connotation:</b> <i>curious</i> is positive (smart, interested) and <i>nosy</i> is negative (rude, prying).`},
  qs:[
   {t:"mc",d:1,q:"The <b>denotation</b> of a word is its…",opts:["feeling","dictionary meaning","rhyme","part of speech"],a:1,hint:"D for…",why:"Denotation is the literal, dictionary meaning of a word."},
   {t:"mc",d:1,q:"The <b>connotation</b> of a word is…",opts:["the feeling or idea the word carries","how many syllables it has","the word's spelling","the dictionary definition"],a:0,hint:"C for: can you feel it?",why:"Connotation is the positive, negative, or neutral feeling attached to a word."},
   {t:"mc",d:2,q:"Which pair of words has the <b>same denotation</b> but a <b>different connotation</b>?",opts:["hot / cold","happy / sad","house / home","run / sit"],a:2,hint:"Find two words that mean almost the same thing.",why:"House and home both mean a place to live, but home feels warm and loving."},
   {t:"mc",d:2,q:`"The kitten's fur was <b>soft</b>." Which word could replace <i>soft</i> and give an even <b>more positive</b> feeling?`,opts:["fuzzy","silky","hairy","shaggy"],a:1,hint:"Which word sounds the most pleasant to touch?",why:"Silky suggests smooth and lovely. Hairy and shaggy sound messy."},
   {t:"multi",d:2,q:"Select ALL the words that mean <b>not heavy</b> but have a <b>negative</b> connotation.",opts:["scrawny","slender","bony","slim","skinny"],a:[0,2,4],hint:"Which ones sound like an insult?",why:"Scrawny, bony, and skinny sound unhealthy or insulting. Slender and slim sound positive."}
  ]},
{ id:"pnn", g:"all", std:["ELA.6.V.1.3"], color:"#2a9d8f", title:"Positive, Negative, Neutral", blurb:"Sort the feelings",
  learn:[
   {h:"Three feelings", html:`<div class="chips"><div class="chip pos"><b>➕ Positive</b><br>sounds like a compliment</div><div class="chip neu"><b>⚪ Neutral</b><br>plain, no strong feeling</div><div class="chip neg"><b>➖ Negative</b><br>sounds like a complaint</div></div>
   ${CONNO("nosy","interested","curious","Animation: nosy, interested, curious on a scale")}`},
   {h:"Word families", html:`<p>Each row means about the same thing. Read from negative to positive:</p>
   <div class="chips">
   <div class="chip"><b style="color:#c2416b">cheap</b> → inexpensive → <b style="color:#1f9d6b">bargain</b></div>
   <div class="chip"><b style="color:#c2416b">stubborn</b> → firm → <b style="color:#1f9d6b">determined</b></div>
   <div class="chip"><b style="color:#c2416b">arrogant</b> → sure → <b style="color:#1f9d6b">confident</b></div>
   <div class="chip"><b style="color:#c2416b">lazy</b> → resting → <b style="color:#1f9d6b">relaxed</b></div>
   <div class="chip"><b style="color:#c2416b">stench</b> → smell → <b style="color:#1f9d6b">aroma</b></div>
   <div class="chip"><b style="color:#c2416b">mob</b> → crowd → <b style="color:#1f9d6b">audience</b></div>
   <div class="chip"><b style="color:#c2416b">chatty</b> → talkative → <b style="color:#1f9d6b">outgoing</b></div>
   <div class="chip"><b style="color:#c2416b">childish</b> → young → <b style="color:#1f9d6b">childlike</b></div></div>`}
  ],
  example:{q:`Is the word <b>"elderly"</b> positive, negative, or neutral? What about <b>"ancient"</b> to describe a person?`,a:`<i>Elderly</i> is <b>neutral to positive</b>: it's a polite way to say older. Calling a person <i>ancient</i> is <b>negative</b> because it sounds rude and exaggerated.`},
  qs:[
   {t:"mc",d:1,q:"Which word has a <b>positive</b> connotation?",opts:["stubborn","pushy","determined","bossy"],a:2,hint:"Which one sounds like a compliment?",why:"Determined sounds admirable. Stubborn, pushy, and bossy are complaints."},
   {t:"mc",d:1,q:"Which word has a <b>neutral</b> connotation?",opts:["smell","stench","aroma","fragrance"],a:0,hint:"Which word is plain, with no strong feeling?",why:"Smell is plain. Stench is negative, and aroma and fragrance are positive."},
   {t:"multi",d:2,q:"Select ALL the words with a <b>positive</b> connotation.",opts:["confident","arrogant","outgoing","chatty","relaxed"],a:[0,2,4],hint:"Which would you want on your report card?",why:"Confident, outgoing, and relaxed are positive. Arrogant and chatty are negative."},
   {t:"mc",d:2,q:"A store wants customers to think its shoes are a good deal. Which word should the ad use?",opts:["cheap","bargain","low-quality","cut-rate"],a:1,hint:"Cheap can sound like poorly made.",why:"Bargain means a good deal. Cheap, low-quality, and cut-rate make the shoes sound badly made."},
   {t:"mc",d:2,q:`A news reporter calls the people at a concert a "<b>mob</b>." What does this word choice suggest?`,opts:["The crowd was calm and polite.","The crowd was wild and out of control.","The crowd was very small.","The reporter enjoyed the concert."],a:1,hint:"Is mob a positive or negative word for a group?",why:"Mob has a negative connotation. It suggests a wild, dangerous crowd."}
  ]},
{ id:"shades", g:"all", std:["ELA.6.V.1.3"], color:"#e76f51", title:"Shades of Meaning", blurb:"Line words up by strength",
  learn:[
   {h:"Words come in shades", html:`<p>Some words are like paint colors: light, medium, and dark. They mean almost the same thing, but some are <b>stronger</b> than others.</p>
   <div class="chips"><div class="chip"><b>warm</b> → hot → <b>scorching</b></div><div class="chip"><b>glad</b> → happy → <b>thrilled</b></div><div class="chip"><b>annoyed</b> → angry → <b>furious</b></div><div class="chip"><b>nibble</b> → eat → <b>devour</b></div><div class="chip"><b>whisper</b> → say → <b>shout</b></div><div class="chip"><b>look</b> → stare → <b>glare</b></div></div>
   <div class="tip"><b>Locksmith question:</b> Which word is the gentlest? Which is the most extreme? Put the others in between.</div>`},
   {h:"Why the shade matters", html:`${FLIP("Marcus was <b>annoyed</b> when his sister ate his cookie.","a little upset","pill-neu","Marcus was <b>furious</b> when his sister ate his cookie.","VERY upset","pill-neg","Animation: annoyed versus furious")}
   <p>One word changes how big the feeling is. Authors choose the exact shade they want you to feel.</p>`}
  ],
  example:{q:`Put these in order from weakest to strongest: <b>freezing, cool, cold</b>.`,a:`<b>cool → cold → freezing.</b> <i>Cool</i> is a little chilly, <i>cold</i> is more, and <i>freezing</i> is the most extreme.`},
  qs:[
   {t:"order",d:2,q:"Put the words in order from <b>weakest</b> to <b>strongest</b>.",items:["glad","happy","overjoyed"],hint:"Start with the smallest feeling.",why:"Glad is a little happy, happy is in the middle, and overjoyed is the strongest."},
   {t:"order",d:2,q:"Put the words in order from <b>most negative</b> to <b>most positive</b>.",items:["scrawny","thin","slender"],hint:"Start with the word that sounds like an insult.",why:"Scrawny is negative, thin is neutral, and slender is positive."},
   {t:"order",d:2,q:"Put the words in order from <b>weakest</b> to <b>strongest</b>.",items:["annoyed","angry","furious"],hint:"Which is just a little upset?",why:"Annoyed is mild, angry is stronger, and furious is the most intense."},
   {t:"mc",d:2,q:`"The hungry wolf ______ its dinner." Which word shows the STRONGEST hunger?`,opts:["nibbled","tasted","ate","devoured"],a:3,hint:"Which word means eating fast and greedily?",why:"Devoured means ate quickly and hungrily, the strongest shade."},
   {t:"mc",d:2,q:`"The coach ______ at the player who skipped practice." Which word shows the coach is the MOST upset?`,opts:["glared","looked","glanced","peeked"],a:0,hint:"Which kind of look is angry?",why:"Glared means stared angrily. Looked, glanced, and peeked show no anger."}
  ]},
{ id:"context", g:"all", std:["ELA.6.V.1.3","ELA.K12.EE.1.1"], color:"#2c7be5", title:"Connotation in a Passage", blurb:"What the words reveal", passage:MARKET,
  learn:[
   {h:"Connotation shows the author's opinion", html:`<p>Authors don't always say "I like this" or "I don't like that." Instead, their <b>word choice</b> shows their opinion.</p>
   <ul><li>Positive words about something → the author <b>likes</b> it.</li><li>Negative words → the author <b>dislikes</b> it.</li></ul>
   <div class="tip"><b>Locksmith steps:</b> 1. Find the describing words and verbs. 2. Mark them ➕ or ➖. 3. Ask: what do these words show about the author's opinion?</div>`},
   {h:"Read the passage", html:`<div class="passage"><div class="pt">${MARKET.title}</div>${MARKET.lines.map((l,k)=>`<p style="margin:0 0 8px"><b style="color:var(--muted)">${k+1}</b> ${l}</p>`).join("")}</div>
   <p>Compare the words about Mr. Patel's stand with the words about the other vendor.</p>`}
  ],
  example:{q:`In sentence 2, why did the author choose "<b>plump</b>" tomatoes instead of "<b>fat</b>" tomatoes?`,a:`<b>Plump</b> has a positive connotation: full, juicy, and healthy. <i>Fat</i> could sound unpleasant. The author wants us to think Mr. Patel's food looks delicious.`},
  qs:[
   {t:"tap",d:2,q:"Tap the sentence with the most <b>positive</b> words about the food.",a:1,hint:"Look for plump, crisp, and glossy.",why:"Sentence 2 uses overflowed, plump, crisp, and glossy, all positive words."},
   {t:"tap",d:2,q:"Tap the sentence that uses <b>negative</b> words to describe the other vendor's food.",a:3,hint:"Which food sounds gross?",why:"Sentence 4 uses wilted, soggy heap, and outrageous, all negative words."},
   {t:"mc",d:2,q:`In sentence 3, the author writes that the vendor "<b>shoved</b>" flyers into people's hands. What does <i>shoved</i> suggest?`,opts:["The vendor was rude and pushy.","The vendor was kind and helpful.","The vendor was shy.","The vendor was very organized."],a:0,hint:"How does it feel to be shoved?",why:"Shoved has a negative connotation. It shows the vendor was rude and pushy, not polite."},
   {t:"mc",d:2,q:`Which word could replace "<b>outrageous</b>" in sentence 4 and be more <b>neutral</b>?`,opts:["ridiculous","shocking","high","insane"],a:2,hint:"Which word just states a fact?",why:"High is plain and neutral. The other choices all add a strong negative feeling."},
   {t:"mc",d:2,q:"How does the author's word choice reveal their opinion of the two stands?",opts:["The author likes both stands the same.","The author prefers Mr. Patel's stand and dislikes the other vendor's.","The author prefers the other vendor's stand.","The author has no opinion."],a:1,hint:"Compare the positive and negative words.",why:"Positive words describe Mr. Patel's stand and negative words describe the other vendor, so the author prefers Mr. Patel."}
  ]},
{ id:"persuade", g:"all", std:["ELA.6.V.1.3","ELA.K12.EE.1.1"], color:"#d9822b", title:"Words That Persuade", blurb:"Connotation in ads & arguments", passage:SHELTER,
  learn:[
   {h:"Writers use connotation to convince you", html:`<p>Ads, speeches, and arguments choose words with strong connotations to change how you <b>feel</b>, and what you <b>do</b>.</p>
   ${FLIP("Try our <b>cheap</b> snack bar!","sounds low quality","pill-neg","Try our <b>budget-friendly</b> snack bar!","sounds smart","pill-pos","Animation: cheap versus budget-friendly")}
   <p><b>Loaded words</b> are words with very strong connotations, chosen on purpose to make you feel a certain way.</p>
   <div class="tip"><b>Smart reader move:</b> When you see loaded words, ask: <i>What does the author want me to feel or do?</i></div>`},
   {h:"Read the passage", html:`<div class="passage"><div class="pt">${SHELTER.title}</div>${SHELTER.lines.map((l,k)=>`<p style="margin:0 0 8px"><b style="color:var(--muted)">${k+1}</b> ${l}</p>`).join("")}</div>
   <p>This author wants you to adopt a shelter pet. Watch for the positive words!</p>`}
  ],
  example:{q:`In sentence 2, the author calls pets "<b>loyal companions</b>" instead of just "<b>animals</b>." Why?`,a:`<b>Loyal companions</b> sounds like a faithful friend, which makes readers feel warm and want a pet. <i>Animals</i> is neutral and wouldn't persuade anyone.`},
  qs:[
   {t:"mc",d:2,q:"What does the author want readers to do?",opts:["buy a pet from a store","adopt a pet from a shelter","stay away from shelters","learn facts about dogs"],a:1,hint:"Read the last sentence.",why:"The author wants readers to visit a shelter and adopt a pet."},
   {t:"tap",d:2,q:"Tap the sentence where the author mentions <b>negative</b> words that other people use, then argues against them.",a:2,hint:"Look for damaged and difficult.",why:"Sentence 3 mentions damaged and difficult, then says that isn't true."},
   {t:"multi",d:2,q:"Select ALL the positive words the author uses to describe shelter pets.",opts:["gentle","damaged","playful","eager to please","difficult"],a:[0,2,3],hint:"Find the compliments in sentence 4.",why:"Gentle, playful, and eager to please are positive. Damaged and difficult are the negative words the author argues against."},
   {t:"mc",d:2,q:`Which phrase in sentence 5 has the strongest positive connotation?`,opts:["Visit","your local shelter","this weekend","your new best friend"],a:3,hint:"Which phrase makes you feel something?",why:"'Your new best friend' makes the pet sound loving and loyal, which persuades readers."},
   {t:"mc",d:2,q:"Why does the author use so many words with positive connotations?",opts:["to give neutral facts about shelters","to make readers feel good about shelter pets so they will adopt one","to make readers afraid of pets","to describe how shelters are built"],a:1,hint:"What is the author's goal?",why:"Positive connotations make readers feel warmly toward shelter pets, which supports the goal of getting them to adopt."}
  ]},
{ id:"boss", g:"all", std:["ELA.6.V.1.3","ELA.K12.EE.1.1"], color:"#c2416b", title:"Boss Challenge", blurb:"FAST-style mixed review",
  learn:[
   {h:"Boss Challenge rules", html:`<p>This lock mixes everything: denotation, connotation, shades of meaning, and what word choice shows. Each question has its own short passage.</p>
   <ul><li>Read the sentence or passage first. Tap 🔊 if you want it read to you.</li><li>Find the key word. Positive, negative, or neutral?</li><li>Ask: <b>why</b> did the author choose this word?</li></ul>

  ],
  qs:[
   {t:"mc",d:2,passage:`After weeks of practice, Lena <b>strutted</b> onto the stage and grabbed the microphone.`,q:"What does the word <i>strutted</i> suggest about Lena?",opts:["She felt nervous and shy.","She walked in a proud, confident way.","She was tired and slow.","She was lost and confused."],a:1,hint:"Picture someone strutting.",why:"Strutted means walked proudly, which shows confidence."},
   {t:"mc",d:2,passage:`The old cabin was <b>cozy</b>, with a crackling fire and a quilt on every chair.`,q:"Which word could replace <i>cozy</i> but give the cabin a <b>negative</b> connotation?",opts:["snug","comfortable","cramped","warm"],a:2,hint:"Which word means small in a bad way?",why:"Cramped also means small, but it sounds uncomfortable. Snug, comfortable, and warm are positive."},

   {t:"mc",d:2,passage:`The tiny hummingbird <b>darted</b> from flower to flower.`,q:"Which is the denotation of <i>darted</i>?",opts:["moved suddenly and quickly","flew lazily","sang loudly","hid nervously"],a:0,hint:"What does the dictionary say darted means?",why:"Darted means moved suddenly and quickly. That is its denotation."},
   {t:"mc",d:2,passage:`Critics called the new movie "a <b>disaster</b>," while fans called it "<b>bold</b>."`,q:"Which statement BEST explains the word choices?",opts:["Both groups loved the movie.","Disaster shows a negative opinion; bold shows a positive one.","Both words are neutral.","Disaster and bold mean the same thing."],a:1,hint:"Sort each word: ➕ or ➖?",why:"Disaster is very negative, and bold is positive, so the critics and fans disagree."},
   {t:"mc",d:2,q:`Which sentence uses a word with the MOST <b>negative</b> connotation?`,opts:["Mia is a thrifty shopper.","Mia is a careful shopper.","Mia is a stingy shopper.","Mia is a smart shopper."],a:2,hint:"Which word is an insult?",why:"Stingy means unwilling to share or spend, which is negative. The others are positive."},
   {t:"order",d:2,q:"Put the words in order from <b>weakest</b> to <b>strongest</b>.",items:["chilly","cold","frigid"],hint:"Which is just a little cool?",why:"Chilly is mild, cold is stronger, and frigid is extremely cold."}
  ]}
];

const qid = (st,i)=>STATIONS[st].id+"-"+i;
function stationDone(st){ return STATIONS[st].qs.every((q,i)=>S.ans[qid(st,i)] && S.ans[qid(st,i)].status); }
function points(){ let p=0; Object.values(S.ans).forEach(a=>{ if(a.status==="right")p+=10; else if(a.status==="second")p+=5; else if(a.status==="written")p+=10; else if(a.status==="missed")p+=2; }); return p; }
let _lastPts=null; function updateScore(){ const p=points(); document.getElementById("scoreNum").textContent = p; if(_lastPts!==null && p>_lastPts){ const e=document.getElementById("scorePill"); e.classList.remove("bump"); void e.offsetWidth; e.classList.add("bump"); } _lastPts=p; }

/* ============ READ ALOUD (Google US English voice) ============ */
let VOICE=null;
function pickVoice(){ try{ const v = speechSynthesis.getVoices(); VOICE = v.find(x=>x.name==="Google US English") || v.find(x=>x.lang==="en-US" && /Google/.test(x.name)) || v.find(x=>x.lang==="en-US") || null; }catch(e){} }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(el){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const clone = el.cloneNode(true); clone.querySelectorAll(".no-read,svg,.speak,textarea,.starters,.nav").forEach(n=>n.remove());
  let txt = clone.innerText.replace(/ELA\.[A-Z0-9.]+/g,"").replace(/[🔑⭐🎉✨🔊]/g,"").replace(/\s+/g," ").trim();
  const u = new SpeechSynthesisUtterance(txt); if(VOICE) u.voice=VOICE; u.lang="en-US"; u.rate=.95;
  speechSynthesis.speak(u);
}
function stopSpeak(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ============ CELEBRATION ============ */
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function popConfetti(){ if(window.confetti) confetti({particleCount:70,spread:70,origin:{y:.75},colors:["#f2b705","#2a9d8f","#e76f51","#7b4fd6","#2c7be5"]}); }
function bigConfetti(){ if(!window.confetti) return; const end=Date.now()+2200; (function f(){ confetti({particleCount:6,angle:60,spread:60,origin:{x:0}}); confetti({particleCount:6,angle:120,spread:60,origin:{x:1}}); if(Date.now()<end) requestAnimationFrame(f); })(); confetti({particleCount:160,spread:110,origin:{y:.6}}); }

/* ============ RENDER ============ */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function go(view,st,step){ stopSpeak(); S.view=view; if(st!==undefined)S.st=st; if(step!==undefined)S.step=step; save(); render(); window.scrollTo({top:0,behavior:"smooth"}); }

function render(){
  updateScore();
  if(!S.name){ return renderWelcome(); }
  if(S.view==="station") return renderStation();
  if(S.view==="finale") return renderFinale();
  renderHome();
}

function renderWelcome(){
  app.innerHTML = `<section class="hero"><h1>${PAGE.title}<br>${PAGE.day}</h1><p>${PAGE.intro} Unlock ${STATIONS.length} locks to earn your golden keys. Your answers save on this iPad, so you can leave and come right back.</p></section>
  <div class="card" style="--c:#2a9d8f"><h3>Welcome, Locksmith!</h3><p>Type your first name to start your key ring.</p>
  <form class="name-row" id="nameForm"><input type="text" id="nameIn" autocomplete="off" placeholder="First name" aria-label="First name"><button class="btn" type="submit">Start →</button></form></div>`;
  document.getElementById("nameForm").addEventListener("submit",e=>{e.preventDefault(); const v=document.getElementById("nameIn").value.trim(); if(!v){toast("Type your name first!");return;} S.name=v.slice(0,30); save(); popConfetti(); toast("Welcome, "+S.name+"!"); render();});
}

function stdHTML(){ return `<div class="stds no-read"><b>Florida B.E.S.T. Standards:</b> ${[...new Set(STATIONS.flatMap(x=>x.std||[]))].map(c=>`<span>${c} ${STD[c].h}</span>`).join("")}</div>`; }
function checkHTML(){ if(!PAGE.checklist.length) return ""; S.check=S.check||{}; return `<div class="card due" style="--c:#c2416b;margin-bottom:18px"><h3>✅ Due Today</h3><p>Check off each one when it's turned in.</p>${PAGE.checklist.map((c,i)=>`<label class="duerow"><input type="checkbox" id="due${i}" data-i="${i}" ${S.check[i]?"checked":""}> <span>${c}</span></label>`).join("")}</div>`; }
function wireChecks(){ document.querySelectorAll(".due input").forEach(cb=>cb.onchange=()=>{ S.check[cb.dataset.i]=cb.checked; save(); if(cb.checked){ toast(pick(PRAISE)); popConfetti(); } if(PAGE.checklist.every((c,i)=>S.check[i])){ bigConfetti(); toast("Everything turned in! 🎉"); } }); }
function renderHome(){
  const doneCount = STATIONS.filter((s,i)=>stationDone(i)).length;
  if(doneCount===STATIONS.length && !S.finale){ S.finale=true; save(); return go("finale"); }
  app.innerHTML = `<section class="hero"><h1>Hi, ${esc(S.name)}!</h1><p>You have <b style="color:var(--gold)">${doneCount} of ${STATIONS.length}</b> keys. Start with Lock 1 and work your way down. Tap any lock to begin or keep going.</p></section>${stdHTML()}${checkHTML()}
  ${GROUPS.map(G=>`<h2 class="grp">${G.title}</h2><p class="grp-note">${G.note}</p><div class="map">${STATIONS.map((s,i)=>{ if(s.g!==G.g) return ""; const d=stationDone(i); const started=s.qs.some((q,j)=>S.ans[qid(i,j)]); return `<button class="lock ${d?"done":""}" style="--c:${s.color}" data-st="${i}">
     ${d?`<span class="keyicon">${KEY_SVG("#c98f00")}</span>`:""}
     <span class="num">Lock ${i+1}</span><h3>${s.title}</h3><p>${s.blurb}</p>${s.std?`<span class="lockstd no-read">${s.std.join(" · ")}</span>`:""}
     <span class="status">${d?"Key earned ✓":started?"Keep going →":"Start →"}</span></button>`}).join("")}</div>`).join("")}
  ${doneCount===STATIONS.length?`<div class="nav"><button class="btn" id="toFinale">See my certificate 🎉</button></div>`:""}`;
  app.querySelectorAll(".lock").forEach(b=>b.addEventListener("click",()=>{ const st=+b.dataset.st; const steps=stepsFor(st); let resume=0; if(S.st===st && S.step) resume=S.step; go("station",st,Math.min(resume,steps.length-1)); }));
  const f=document.getElementById("toFinale"); if(f) f.onclick=()=>go("finale");
  wireChecks();
}

function passageHTML(s){
  if(s.passageHtml) return s.passageHtml;
  if(!s.passage) return "";
  return `<div class="passage"><div class="pt">${s.passage.title}</div>${s.passage.lines.map((l,k)=>`<p style="margin:0 0 8px"><b style="color:var(--muted)">${k+1}</b> ${l}</p>`).join("")}</div>`;
}

function renderStation(){
  const s = STATIONS[S.st], steps = stepsFor(S.st);
  if(S.step>=steps.length) S.step=steps.length-1;
  const step = steps[S.step];
  const pct = Math.round((S.step)/(steps.length-1)*100);
  let body="", canNext=true, label="";
  if(step.kind==="learn"){ const l=s.learn[step.i]; label="Learn it"; body=(step.i===0?stdBox(s):"")+`<h3>${l.h}</h3>${l.html}`; }
  else if(step.kind==="example"){ label="Try it together"; body=`<h3>Watch me unlock one</h3><p class="q">${s.example.q}</p><p>Think about it first. Then tap to check your thinking.</p><button class="btn dark no-read" id="reveal">Show the answer</button><div class="example-reveal" id="exAns" hidden><div class="feedback good"><b class="big">Here's how a locksmith thinks:</b>${s.example.a}</div></div>`; }
  else if(step.kind==="q"){ const q=s.qs[step.i]; label=q.t==="write"?"Write it":"Practice "+(step.i+1)+" of "+s.qs.length; body=questionHTML(s,q,step.i); canNext=!!(S.ans[qid(S.st,step.i)]&&S.ans[qid(S.st,step.i)].status); }
  else { label="Key unlocked"; body=doneHTML(s); }
  app.innerHTML = `<div class="station-head"><div><div class="eyebrow">Lock ${S.st+1} of ${STATIONS.length}</div><h2>${s.title}</h2></div><button class="btn ghost" id="toMap" style="color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)">← Key map</button></div>
  <div class="progress" aria-label="Progress"><i style="width:${pct}%"></i></div>
  <article class="card" id="card" style="--c:${s.color}"><button class="speak no-read" id="speakBtn">🔊 Read to me</button><span class="step-tag no-read">${label}</span>${body}
  <div class="nav no-read"><button class="btn ghost" id="back" ${S.step===0?"disabled":""}>← Back</button>
  ${step.kind==="done"?`<button class="btn" id="next">${S.st<STATIONS.length-1?"Next lock →":"Finish 🎉"}</button>`:`<button class="btn" id="next" ${canNext?"":"disabled"}>Next →</button>`}</div></article>`;
  document.getElementById("toMap").onclick=()=>go("home");
  document.getElementById("speakBtn").onclick=()=>speak(document.getElementById("card"));
  document.getElementById("back").onclick=()=>go("station",S.st,S.step-1);
  document.getElementById("next").onclick=()=>{
    if(step.kind==="done"){ if(S.st<STATIONS.length-1) go("station",S.st+1,0); else go("finale"); }
    else go("station",S.st,S.step+1);
  };
  const r=document.getElementById("reveal"); if(r) r.onclick=()=>{ document.getElementById("exAns").hidden=false; r.hidden=true; popConfetti(); };
  if(step.kind==="q") wireQuestion(s,s.qs[step.i],step.i);
  if(step.kind==="done" && !S.celebrated[s.id]){ S.celebrated[s.id]=true; save(); setTimeout(bigConfetti,250); }
}

function doneHTML(s){
  const st=S.st; let right=0,total=0;
  s.qs.forEach((q,i)=>{ const a=S.ans[qid(st,i)]; if(q.t!=="write"){ total++; if(a&&(a.status==="right"||a.status==="second")) right++; } });
  const all = stationDone(st);
  if(!all) return `<div class="center"><h3>Almost there!</h3><p>You still have some practice to finish in this lock. Tap Back to find it.</p></div>`;
  return `<div class="center"><span class="bigkey">${KEY_SVG(s.color)}</span><h3>Key unlocked: ${s.title}!</h3>
  <p>Amazing work, ${esc(S.name)}! You got <b>${right} of ${total}</b> practice questions. Every key you earn makes you a stronger reader.</p>
  <p>${pick(["Your brain just grew a little bigger!","That's how real locksmiths work: one key at a time.","You should be proud of yourself!"])}</p></div>`;
}

/* ---------- question HTML ---------- */
function questionHTML(s,q,i){
  const a=S.ans[qid(S.st,i)]||{};
  let h = "";
  if(q.t==="tap"){ h+=`<div class="passage"><div class="pt">${s.passage.title}</div>${s.passage.lines.map((l,k)=>`<button class="tapline" data-k="${k}"><b style="color:var(--muted)">${k+1}</b> ${l}</button>`).join("")}</div>`; }
  else { if(q.passage) h+=`<div class="passage">${q.passage}</div>`; else if(s.passage||s.passageHtml) h+=passageHTML(s); }
  h+=`<span class="dok no-read">${q.d===1?"DOK 1 · Remember it":"DOK 2 · Use it"}</span><p class="q">${q.q}</p>`;
  if(q.t==="mc"){ h+=`<div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="ltr">${"ABCDE"[k]}</span><span>${o}</span></button>`).join("")}</div>`; }
  if(q.t==="multi"){ h+=`<p class="no-read" style="font-size:15px;color:var(--muted)">Tap every answer that fits, then tap Check.</p><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}" aria-pressed="false"><span class="ltr">${"ABCDE"[k]}</span><span>${o}</span></button>`).join("")}</div><div class="nav no-read" style="justify-content:flex-start"><button class="btn dark" id="check">Check</button></div>`; }
  if(q.t==="order"){ h+=`<p class="no-read" style="font-size:15px;color:var(--muted)">Tap the cards in the correct order. Tap Start over to try again.</p><div class="order-ans" id="oAns"></div><div class="order-bank" id="oBank"></div><div class="nav no-read" style="justify-content:flex-start"><button class="btn dark" id="check">Check</button><button class="btn ghost" id="oReset">Start over</button></div>`; }
  if(q.t==="write"){ h+=`<div class="starters no-read">${q.starters.map(t=>`<button type="button" data-s="${esc(t)}">+ ${esc(t)}</button>`).join("")}</div>
   <textarea id="wbox" aria-label="Your answer" placeholder="Type or write with your Apple Pencil here…">${esc(a.text||"")}</textarea><div class="wc no-read" id="wc"></div>
   <div class="nav no-read" style="justify-content:flex-start"><button class="btn dark" id="submitW">Submit my writing</button></div>`; }
  h+=`<div id="fb"></div>`;
  return h;
}

function setAns(i,obj){ S.ans[qid(S.st,i)] = Object.assign(S.ans[qid(S.st,i)]||{},obj); save(); updateScore(); }
function enableNext(){ const n=document.getElementById("next"); if(n) n.disabled=false; }
function fb(kind,title,msg){ document.getElementById("fb").innerHTML=`<div class="feedback ${kind}"><b class="big">${title}</b>${msg}</div>`; }

function wireQuestion(s,q,i){
  const key=qid(S.st,i); const a=S.ans[key]||{};
  const finished = !!a.status;

  if(q.t==="mc"||q.t==="tap"){
    const sel = q.t==="mc"?".opt":".tapline";
    const btns=[...app.querySelectorAll(sel)];
    const show=()=>{ btns.forEach(b=>{ const k=+b.dataset.k; if(k===q.a) b.classList.add("right"); else if((a.wrong||[]).includes(k)) b.classList.add("wrong"); b.disabled=true; }); };
    (a.wrong||[]).forEach(k=>{ btns[k].classList.add("wrong"); btns[k].disabled=true; });
    if(finished){ show(); fb(a.status==="missed"?"miss":"good", a.status==="missed"?"Here's the key:":"You got it!", q.why); return; }
    btns.forEach(b=>b.addEventListener("click",()=>{
      const k=+b.dataset.k; const cur=S.ans[key]||{wrong:[]}; const wrong=cur.wrong||[];
      if(k===q.a){ setAns(i,{status:wrong.length?"second":"right",wrong}); a.wrong=wrong; show(); fb("good",pick(PRAISE)+" ✨",q.why); popConfetti(); toast(wrong.length?"+5 key points":"+10 key points"); enableNext(); }
      else{ wrong.push(k); a.wrong=wrong; b.classList.add("wrong"); b.disabled=true;
        if(wrong.length>=2){ setAns(i,{status:"missed",wrong}); show(); fb("miss","Good effort! Here's the key:",q.why+" <br><br>Now you know it for next time. Keep going!"); enableNext(); }
        else { setAns(i,{wrong}); fb("hint",pick(RETRY),"💡 Hint: "+q.hint); } }
    }));
  }

  if(q.t==="multi"){
    const btns=[...app.querySelectorAll(".opt")]; const chosen=new Set(a.picked||[]);
    const paint=()=>btns.forEach(b=>{ const on=chosen.has(+b.dataset.k); b.classList.toggle("sel",on); b.setAttribute("aria-pressed",on); });
    const reveal=()=>{ btns.forEach(b=>{ const k=+b.dataset.k; b.classList.remove("sel"); if(q.a.includes(k)) b.classList.add("right"); else if(chosen.has(k)) b.classList.add("wrong"); b.disabled=true; }); document.getElementById("check").hidden=true; };
    paint();
    if(finished){ reveal(); fb(a.status==="missed"?"miss":"good",a.status==="missed"?"Here's the key:":"You got it!",q.why); return; }
    btns.forEach(b=>b.addEventListener("click",()=>{ const k=+b.dataset.k; chosen.has(k)?chosen.delete(k):chosen.add(k); paint(); }));
    document.getElementById("check").onclick=()=>{
      if(!chosen.size){ toast("Pick at least one!"); return; }
      const ok = chosen.size===q.a.length && q.a.every(k=>chosen.has(k));
      const tries=(S.ans[key]&&S.ans[key].tries)||0;
      if(ok){ setAns(i,{status:tries?"second":"right",picked:[...chosen]}); reveal(); fb("good",pick(PRAISE)+" ✨",q.why); popConfetti(); toast(tries?"+5 key points":"+10 key points"); enableNext(); }
      else if(tries>=1){ setAns(i,{status:"missed",picked:[...chosen],tries:2}); reveal(); fb("miss","Good effort! Here's the key:",q.why); enableNext(); }
      else { setAns(i,{tries:1}); fb("hint",pick(RETRY),"💡 Hint: "+q.hint); }
    };
  }

  if(q.t==="order"){
    const bank=document.getElementById("oBank"), ans=document.getElementById("oAns");
    let order=[]; const shuffled=q.items.map((t,k)=>k).sort(()=>Math.random()-.5);
    if(shuffled.every((v,k)=>v===k)) shuffled.reverse();
    const draw=()=>{
      ans.innerHTML = order.length?order.map((k,n)=>`<div class="opt" style="cursor:default"><span class="ltr">${n+1}</span><span>${q.items[k]}</span></div>`).join(""):`<span style="color:var(--muted);padding:6px">Your order will appear here.</span>`;
      bank.innerHTML = shuffled.filter(k=>!order.includes(k)).map(k=>`<button class="opt" data-k="${k}"><span class="ltr">+</span><span>${q.items[k]}</span></button>`).join("");
      bank.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ order.push(+b.dataset.k); draw(); });
    };
    const final=()=>{ order=q.items.map((t,k)=>k); draw(); ans.querySelectorAll(".opt").forEach(e=>e.classList.add("right")); document.getElementById("check").hidden=true; document.getElementById("oReset").hidden=true; };
    if(finished){ final(); fb(a.status==="missed"?"miss":"good",a.status==="missed"?"Here's the correct order:":"You got it!",q.why); return; }
    draw();
    document.getElementById("oReset").onclick=()=>{ order=[]; draw(); };
    document.getElementById("check").onclick=()=>{
      if(order.length<q.items.length){ toast("Place every card first!"); return; }
      const ok=order.every((v,k)=>v===k); const tries=(S.ans[key]&&S.ans[key].tries)||0;
      if(ok){ setAns(i,{status:tries?"second":"right"}); final(); fb("good",pick(PRAISE)+" ✨",q.why); popConfetti(); toast(tries?"+5 key points":"+10 key points"); enableNext(); }
      else if(tries>=1){ setAns(i,{status:"missed",tries:2}); final(); fb("miss","Good effort! Here's the correct order:",q.why); enableNext(); }
      else { setAns(i,{tries:1}); order=[]; draw(); fb("hint",pick(RETRY),"💡 Hint: "+q.hint); }
    };
  }

  if(q.t==="write"){
    const box=document.getElementById("wbox"), wc=document.getElementById("wc");
    const count=()=>{ const n=(box.value.trim().match(/\S+/g)||[]).length; wc.textContent=n+" words · aim for at least 20 · saved on this iPad"; return n; };
    count();
    box.addEventListener("input",()=>{ setAns(i,{text:box.value}); count(); });
    app.querySelectorAll(".starters button").forEach(b=>b.onclick=()=>{ box.value=(box.value.trim()?box.value.trimEnd()+" ":"")+b.dataset.s+" "; box.focus(); setAns(i,{text:box.value}); count(); });
    const praise=()=>{ const txt=box.value.toLowerCase(); const hits=q.look.filter(w=>txt.includes(w)); const extra = hits.length>=2?"You used strong skill words like <b>"+hits.slice(0,3).join(", ")+"</b>. That shows real understanding!":"Nice job putting your thinking into words!";
      fb("good","Writing saved! "+pick(PRAISE)+" 📝",extra+`<div class="model"><b>Compare with a model answer:</b><br>${q.model}<br><br><i>Does your answer have the same key ideas? You can still add to yours above.</i></div>`); };
    if(finished){ praise(); }
    document.getElementById("submitW").onclick=()=>{
      const n=count();
      if(n<12){ fb("hint","Keep building!","Write a little more. Try using the sentence starters above. Aim for at least 20 words."); return; }
      const first=!S.ans[key].status; setAns(i,{status:"written",text:box.value}); praise(); if(first){ popConfetti(); toast("+10 key points"); } enableNext();
    };
  }
}

function renderFinale(){
  const rows = STATIONS.map((s,i)=>{ let r=0,t=0; s.qs.forEach((q,j)=>{ if(q.t!=="write"){t++; const a=S.ans[qid(i,j)]; if(a&&(a.status==="right"||a.status==="second"))r++;} }); return {s,r,t,done:stationDone(i)}; });
  const allDone = rows.every(x=>x.done);
  const date = new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  app.innerHTML = `<div class="card cert" style="--c:#f2b705">
   <span class="bigkey">${KEY_SVG("#c98f00")}</span>
   <h2>${allDone?PAGE.day+" Complete!":"Keep unlocking!"}</h2>
   <p>${allDone?"This certifies that":"You're doing great,"}</p>
   <div class="who">${esc(S.name)}</div>
   <p>${allDone?"unlocked all "+STATIONS.length+" locks of "+PAGE.title+" "+PAGE.day+" with "+points()+" key points.":"Finish the rest of the locks to earn your certificate."}</p>
   <p style="color:var(--muted)">${date}</p>
   <div class="tally">${rows.map(x=>`<div><b>${x.s.title}</b><br>${x.done?x.r+" / "+x.t+" correct ✓":"not finished yet"}</div>`).join("")}</div>
   <p class="no-read">Show this screen to your teacher, or tap Copy my results to paste them into Canvas.</p>
   <div class="nav" style="justify-content:center"><button class="btn" id="copyRes">Copy my results</button><button class="btn ghost" id="toMap2">← Key map</button></div>
  </div>`;
  if(allDone){ setTimeout(bigConfetti,200); setTimeout(bigConfetti,1600); toast("You did it, "+S.name+"! 🎉"); }
  document.getElementById("toMap2").onclick=()=>go("home");
  document.getElementById("copyRes").onclick=()=>{
    let txt=`${PAGE.title} ${PAGE.day} – ${S.name} – ${date}\nKey points: ${points()}\n\n`;
    rows.forEach((x,i)=>{ txt+=`${x.s.title}: ${x.done?x.r+"/"+x.t+" correct":"not finished"}\n`; x.s.qs.forEach((q,j)=>{ if(q.t==="write"){ const a=S.ans[qid(i,j)]; txt+=`  Writing: ${a&&a.text?a.text.trim():"(blank)"}\n`; } }); });
    navigator.clipboard.writeText(txt).then(()=>toast("Copied! Paste it in Canvas.")).catch(()=>{ const ta=document.createElement("textarea"); ta.value=txt; ta.style.width="100%"; ta.rows=8; document.querySelector(".cert").appendChild(ta); ta.select(); toast("Select all and copy the box below."); });
  };
}

render();
</script>


</body></html>
